name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win --publish never
        env:
          # Optional: set WIN_CSC_LINK (base64 PFX) + WIN_CSC_PASSWORD repo
          # secrets to produce a signed installer. Empty = unsigned build.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer produced" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Status: $($sig.Status)"
          Write-Output "Signer: $($sig.SignerCertificate.Subject)"
          if ($env:CSC_LINK -and $sig.Status -ne "Valid") {
            throw "Signing was requested but the signature is not valid"
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.exe
          fail_on_unmatched_files: true

  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Package DMG (unsigned until an Apple cert is configured)
        run: npx electron-builder --mac --publish never
        env:
          # Skip keychain cert discovery so the build succeeds without an
          # Apple Developer ID certificate. Remove once CSC_LINK is set.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Optional: set APPLE_CERT_LINK / APPLE_CERT_PASSWORD secrets
          # (Developer ID Application .p12) to sign + notarize.
          CSC_LINK: ${{ secrets.APPLE_CERT_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.dmg
          fail_on_unmatched_files: true

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Package AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: true

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Configure signing (optional)
        shell: bash
        env:
          CERT_LINK: ${{ secrets.WIN_CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.WIN_CSC_PASSWORD }}
        run: |
          if [ -n "$CERT_LINK" ]; then
            echo "CSC_LINK=$CERT_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Package installer
        run: npx electron-builder --win --publish never

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer produced" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Output "Status: $($sig.Status)"
          Write-Output "Signer: $($sig.SignerCertificate.Subject)"
          if ($env:CSC_LINK -and $sig.Status -ne "Valid") {
            throw "Signing was requested but the signature is not valid"
          }

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.exe
          fail_on_unmatched_files: true

  build-macos-arm64:
    name: macOS ARM64 (DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Configure signing (optional)
        shell: bash
        env:
          CERT_LINK: ${{ secrets.APPLE_CERT_LINK }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT_LINK" ]; then
            echo "CSC_LINK=$CERT_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Package DMG (unsigned until an Apple cert is configured)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*-mac-arm64.dmg
          fail_on_unmatched_files: true

  build-macos-x64:
    name: macOS Intel (DMG)
    # macos-15-intel is the last x86_64 GitHub-hosted image (supported until Aug 2027).
    # Building on a native Intel runner ensures the Prisma query engine matches the arch.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Configure signing (optional)
        shell: bash
        env:
          CERT_LINK: ${{ secrets.APPLE_CERT_LINK }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT_LINK" ]; then
            echo "CSC_LINK=$CERT_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Package DMG (unsigned until an Apple cert is configured)
        run: npx electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*-mac-x64.dmg
          fail_on_unmatched_files: true

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build renderer + main
        run: npm run build

      - name: Package AppImage + deb
        run: npx electron-builder --linux --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.AppImage
            release/*.deb
          fail_on_unmatched_files: true
